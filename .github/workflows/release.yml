# Публикация в npm при публикации GitHub Release (кнопка «Publish release»).
# Перед релизом: поднимите version в package.json и CHANGELOG, закоммитьте,
# создайте тег vX.Y.Z (совпадающий с version), запушьте тег, затем в Releases
# создайте релиз по этому тегу и опубликуйте его.
#
# Секрет репозитория NPM_TOKEN: Automation Access Token из npmjs.com
# (разрешение publish для scope @waystar). См. Settings → Secrets → Actions.

name: Release to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify package.json version matches release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="${TAG_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::package.json version ($VER) does not match release tag ($TAG_NAME → expected suffix $TAG)"
            exit 1
          fi
          echo "Version OK: $VER"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Biome check
        run: bun run check

      - name: Setup Node (npm auth)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
